<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f8fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Dorganda High School student, teacher, and administrator portal." />
  <title>Dorganix | Student Portal</title>
  <link rel="icon" href="assets/dorganix-school-seal.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/dorganix-icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" aria-hidden="true">
    <div class="loading-card">
      <span class="loading-spinner" aria-hidden="true"></span>
      <strong id="loading-message">Please wait…</strong>
      <div class="loading-track" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
